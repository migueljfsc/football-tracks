[project]
name = "football-tracks"
version = "0.8.0"
description = "Broadcast football clip -> player tracks in pitch metres, for import into Pitchboard."
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "typer>=0.15",
    "numpy>=2.1",
    "opencv-python>=4.10",
    "scenedetect>=0.6.4",
    # Optimal assignment for the tracker. Already present transitively; declared
    # because relying on somebody else's dependency is how a working install breaks.
    "scipy>=1.14",
]

# Installed per stage rather than all at once: stage 0 needs none of this, and a
# torch install that fails should not block the stage that does not use torch.
[project.optional-dependencies]
# RT-DETR through transformers: Apache-2.0, and measurably better than torchvision's
# Faster R-CNN, which it replaced (see detect.py). torchvision went with it and nothing
# imports it now. Ultralytics is deliberately absent - AGPL-3.0 against this repo's MIT
# (D9). supervision is absent too: MIT, but its ByteTrack is deprecated and goes away in
# 0.31, so the tracker is our own.
vision = ["torch>=2.5", "transformers>=5.0"]
# The pitch-line segmenter (D36). torchvision is back, for its pretrained segmentation
# backbones rather than its detectors -- the detector it used to supply lost to RT-DETR
# and is still gone.
calib = ["torch>=2.5", "torchvision>=0.20"]
# Deliberately empty. Shirt-number OCR was tried and does not work on this footage: a
# general-purpose reader takes one digit out of a two-digit number and is confident about
# it, so numbers come out wrong four times as often as right (D32). The extra remains so
# the pipeline's shape still says where such a thing would go.
ocr = []
data = ["SoccerNet>=0.1.60"]

[dependency-groups]
dev = ["ruff>=0.8", "mypy>=1.13", "pytest>=8.3"]

[project.scripts]
ft = "football_tracks.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/football_tracks"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
files = ["src", "tests"]
python_version = "3.12"
strict = true

# scenedetect ships no stubs. Confined to it, so a missing stub anywhere else is
# still an error rather than a silent Any. cv2 5.x types itself - see MatLike.
[[tool.mypy.overrides]]
# The vision and data extras are not installed in CI - torch alone is two gigabytes, and
# nothing that runs there needs a model. Their imports are inside the functions that use
# them, so this only silences the type checker looking at those bodies.
module = [
    "scenedetect.*",
    "scipy.*",
    "transformers.*",
    "torch.*",
    "torchvision.*",
    "certifi.*",
    "huggingface_hub.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
