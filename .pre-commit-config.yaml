# See https://pre-commit.com. Install: pre-commit install
#
# ruff and mypy run through uv rather than as pre-commit's own environments, so the
# hooks use exactly the versions pinned in uv.lock. Two resolvers disagreeing about a
# linter version is a commit that passes locally and fails in CI.
default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.18.0
    hooks:
      - id: commitizen
      - id: commitizen-branch
        stages: [pre-push]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: mixed-line-ending
      - id: debug-statements
      # Clips are large and everything under work/ is reproducible. Neither belongs
      # here, and .gitignore already says so - this is the backstop for a forced add.
      - id: check-added-large-files
        args: [--maxkb=512]

  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        files: \.py$
        require_serial: true

      - id: ruff
        name: ruff
        entry: uv run ruff check --fix
        language: system
        files: \.py$
        require_serial: true

      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        files: \.py$
        pass_filenames: false
        require_serial: true
