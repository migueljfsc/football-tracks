---
commitizen:
  bump_message: "chore(release): bump $current_version \u2192 $new_version [skip ci]"
  major_version_zero: true
  name: cz_conventional_commits
  # uv.lock records the project's OWN version, and bumping pyproject.toml without it
  # leaves the two disagreeing. Nothing breaks — `uv sync --frozen` tolerates it — but
  # `uv run` re-locks on every invocation, so the drift comes back as an unrelated diff
  # in whatever anyone commits next, and it failed a pre-commit run by rewriting the file
  # underneath the hooks. This runs after the version files are updated and before
  # commitizen stages them, so the fresh lock lands in the bump commit itself.
  #
  # Tolerant on purpose: a release must not fail over a field this cosmetic. uv reaches
  # the action's container through `extra_requirements` in release.yml.
  pre_bump_hooks:
  - uv lock && git add uv.lock || echo "uv unavailable; uv.lock left to drift"
  tag_format: v$version
  update_changelog_on_bump: true
  version: 0.11.0
  version_files:
  - .cz.yaml:version
  - pyproject.toml:^version
  - src/football_tracks/__init__.py:__version__
  version_scheme: semver
