---
commitizen:
  bump_message: "chore(release): bump $current_version \u2192 $new_version [skip ci]"
  major_version_zero: true
  name: cz_conventional_commits
  pre_bump_hooks:
  - uv lock && git add uv.lock || echo "uv unavailable; uv.lock left to drift"
  tag_format: v$version
  update_changelog_on_bump: true
  version: 0.14.0
  version_files:
  - .cz.yaml:version
  - pyproject.toml:^version
  - src/football_tracks/__init__.py:__version__
  version_scheme: semver
