---
commitizen:
  bump_message: "chore(release): bump $current_version → $new_version [skip ci]"
  major_version_zero: true
  name: cz_conventional_commits
  tag_format: v$version
  update_changelog_on_bump: true
  version: 0.1.0
  version_files:
  - .cz.yaml:version
  - pyproject.toml:^version
  - src/football_tracks/__init__.py:__version__
  version_scheme: semver
